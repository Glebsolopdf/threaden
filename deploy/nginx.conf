limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
  listen 80;
  server_name threaden.substituteme.space opentalk.substituteme.space;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://threaden.substituteme.space$request_uri;
  }
}

server {
  listen 80;
  server_name api.substituteme.space livekit.substituteme.space turn.substituteme.space;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name threaden.substituteme.space;

  ssl_certificate /etc/letsencrypt/live/threaden.substituteme.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/threaden.substituteme.space/privkey.pem;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  root /var/www/opentalk;
  index index.html;

  location ~ ^/v1/auth/(register|login)$ {
    client_max_body_size 128k;
    limit_req zone=auth_per_ip burst=5 nodelay;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /v1/ {
    client_max_body_size 10m;
    limit_conn conn_per_ip 20;
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2;
  server_name opentalk.substituteme.space;

  ssl_certificate /etc/letsencrypt/live/opentalk.substituteme.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opentalk.substituteme.space/privkey.pem;

  return 301 https://threaden.substituteme.space$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.substituteme.space;

  ssl_certificate /etc/letsencrypt/live/opentalk.substituteme.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opentalk.substituteme.space/privkey.pem;

  location / {
    client_max_body_size 10m;
    limit_conn conn_per_ip 20;
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~ ^/v1/auth/(register|login)$ {
    client_max_body_size 128k;
    limit_req zone=auth_per_ip burst=5 nodelay;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name livekit.substituteme.space;

  ssl_certificate /etc/letsencrypt/live/opentalk.substituteme.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opentalk.substituteme.space/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
