name: voice-rooms

services:
  backend:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/app.db
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      ROOM_TTL: ${ROOM_TTL:-12h}
      LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-30m}
      SESSION_TTL: ${SESSION_TTL:-168h}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-24h}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MAX_ROOM_PARTICIPANTS: ${MAX_ROOM_PARTICIPANTS:-16}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:4200}
      ATTACHMENT_STORAGE_DIR: /data/attachments
      ATTACHMENT_MAX_INPUT_MEDIA_BYTES: ${ATTACHMENT_MAX_INPUT_MEDIA_BYTES:-10485760}
      ATTACHMENT_MAX_ARCHIVE_BYTES: ${ATTACHMENT_MAX_ARCHIVE_BYTES:-5242880}
      ATTACHMENT_MAX_OUTPUT_MEDIA_BYTES: ${ATTACHMENT_MAX_OUTPUT_MEDIA_BYTES:-1048576}
      ATTACHMENT_MAX_FILES_PER_MESSAGE: ${ATTACHMENT_MAX_FILES_PER_MESSAGE:-3}
      ATTACHMENT_MAX_USER_STORED_BYTES: ${ATTACHMENT_MAX_USER_STORED_BYTES:-52428800}
      ATTACHMENT_MAX_USER_DAILY_BYTES: ${ATTACHMENT_MAX_USER_DAILY_BYTES:-20971520}
      ATTACHMENT_MAX_TOTAL_BYTES: ${ATTACHMENT_MAX_TOTAL_BYTES:-5368709120}
      ATTACHMENT_RETENTION: ${ATTACHMENT_RETENTION:-72h}
    volumes:
      - backend-data:/data
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.4
    restart: unless-stopped
    network_mode: host
    command: ["--dev", "--config", "/etc/livekit.yaml", "--bind", "127.0.0.1"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
volumes:
  backend-data:
